<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/crypto-js/4.2.0/crypto-js.min.js"></script>
    <title>캐릭터 체형 정보</title>
    <style>
        * {
            text-decoration: none;
        }
        :root {
            --rounded-corner-circle: 9999px;
            --rounded-corner-large: 16px;
            --rounded-corner-normal: 8px;
            --rounded-corner-small: 4px;
            --rounded-corner-none: 0px;

            --default-color: #000;
            --border-color-dark: #231815;
            --border-color-mid: #999999;
            --border-color-light: #cfcfcf;
            --baseLine-color: #ff0000;

            --border-thick: 2px;
            --border-normal: 0.5px;
            --border-light: 0.5px;

            --point-size: 10px;
        }
        body {
            font-family: Arial, sans-serif;
            height: 100vh;
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            background-color: #d9d9d9;
            z-index: 0;
        }
        .title {
            margin: 0 auto;
            display: flex;
            align-items: center;
        }
        #chart {
            box-sizing: border-box;
            width: calc(100% - 60px);
            height: calc(100% - 60px);
            border: 1px solid var(--default-color);
            overflow-y: auto;
            padding: 60px;
            border-radius: var(--rounded-corner-large);
        }
        #chart-content {
            border-left: 2px solid var(--baseLine-color);
            border-bottom: 2px solid var(--baseLine-color);
            margin-left: -2px;
            margin-bottom: -2px;
            width: 100%;
            height: 100%;
            position: relative;
        }
        .password-modal {
            display: flex;
            text-align: center;
            box-sizing: border-box;
            max-width: 400px;
            max-height: 250px;
            align-items: center;
            border: 1px solid var(--border-color-mid);
            border-radius: var(--rounded-corner-large);
            padding: 40px 30px;
            background-color: white;
            flex-direction: column;
        }
        input:focus-visible {
            outline: none;
        }
        #input-box {
            margin-top: 10px;
            height: 20px;
            width: 200px;
            padding: 10px;
            border-radius: var(--rounded-corner-normal);
            border: 1px solid var(--border-color-mid);

        }
        .line, .char-node, .line-label, .text-box {
            position: absolute;
        }
        .horizontal {
            left: 0;
            width: 100%;
        }
        .vertical {
            bottom: 0;
            height: 100%;
        }
        .line-label {
            z-index: 3;
            font-size: 1em;
            font-weight: bold;
        }
        .thick {
            background-color: var(--border-color-dark);
            z-index: 3;
        }
        .medium {
            background-color: var(--border-color-mid);
            z-index: 2;
        }
        .light {
            background-color: var(--border-color-light);
            z-index: 1;
        }
        .horizontal.thick {
            height: var(--border-thick);
        }
        .vertical.thick {
            width: calc(var(--border-thick) * 0.5);
        }
        .horizontal.medium {
            height: var(--border-normal);
        }
        .vertical.medium {
            width: var(--border-normal);
        }
        .horizontal.light {
            height: var(--border-light);
        }
        .vertical.light {
            width: var(--border-light);
        }
        .char-node {
            display: flex;
            z-index: 4;
            transform: translate(calc(-50% + 0.5px), calc(50% - 0.5px));
        }
        .dot {
            box-sizing: border-box;
            border-radius: var(--rounded-corner-circle);
            width: var(--point-size);
            height: var(--point-size);
        }
        .text-box {
            left: 13px;
            bottom: -5.8px;
            width: fit-content;
            white-space: nowrap;
            z-index: 5;
            font-size: 1.05em;
        }
    </style>
</head>
<body>
    <div class="password-modal">
        <svg xmlns="http://www.w3.org/2000/svg" height="24px" viewBox="0 -960 960 960" width="24px" fill="#1f1f1f"><path d="M240-80q-33 0-56.5-23.5T160-160v-400q0-33 23.5-56.5T240-640h40v-80q0-83 58.5-141.5T480-920q83 0 141.5 58.5T680-720v80h40q33 0 56.5 23.5T800-560v400q0 33-23.5 56.5T720-80H240Zm0-80h480v-400H240v400Zm296.5-143.5Q560-327 560-360t-23.5-56.5Q513-440 480-440t-56.5 23.5Q400-393 400-360t23.5 56.5Q447-280 480-280t56.5-23.5ZM360-640h240v-80q0-50-35-85t-85-35q-50 0-85 35t-35 85v80ZM240-160v-400 400Z"/></svg>
        <form id="password">
            <input id="input-box" type="password" placeholder="비밀번호 입력" maxlength="8" value="">
            <button type="submit" style="display: none"></button>
        </form>
    </div>
<script>
    const chart=document.createElement("div");chart.id="chart";const chartContent=document.createElement("div");chartContent.id="chart-content";const characterNodes=document.createElement("div");characterNodes.className="node-container";const getRange=(t,e)=>{const n=t.filter(t=>{const e=parseFloat(t.height),n=parseFloat(t.weight);return Number.isFinite(e)&&e>0&&Number.isFinite(n)&&n>0}).map(t=>parseFloat(t[e]));return 0===n.length?{min:0,max:0}:{min:10*Math.trunc(.1*Math.min(...n))-10,max:10*Math.trunc(.1*Math.max(...n))+10}},normalize=(t,e,n)=>(t-e)/(n-e);function addLines(t,e,n,a){const o=document.createElement("div");o.className=`line-container ${a}`;const c=document.createElement("div");c.classList.add("line-label"),c.style.position="absolute",c.style.zIndex="3",c.textContent=`${t}${n}`,"horizontal"===a?(c.style.left=t<100?"-44px":"-53px",c.style.bottom="0px"):(c.style.left="0px",c.style.bottom="-20px"),o.appendChild(c);for(let c=t+1;c<e;c+=1){const i=100*normalize(c,t,e),r=document.createElement("div");if(r.classList.add("line",`${a}`),"horizontal"===a?r.style.bottom=`${i}%`:r.style.left=`${i}%`,c%100==0){r.classList.add("thick");const t=document.createElement("div");t.classList.add("line-label"),t.textContent=`${c}${n}`,"horizontal"===a?(t.style.left="-53px",t.style.bottom=`${i}%`):(t.style.left=`${i+.15}%`,t.style.bottom="-20px"),o.appendChild(t)}else c%10==0?r.classList.add("medium"):r.classList.add("light");o.appendChild(r)}chartContent.appendChild(o)}function addCharacter(t,e,n,a,o){const c=100*normalize(parseFloat(t.weight),a,o),i=100*normalize(parseFloat(t.height),e,n);if(!Number.isFinite(c)||!Number.isFinite(i))return;const r=document.createElement("div");r.className="char-node",r.style.left=`${c}%`,r.style.bottom=`${i}%`;const s=document.createElement("div");s.className="dot",s.style.background=`color-mix(in srgb, ${t.inner} 50%, transparent)`,s.style.border=`2px solid ${t.outer}`,JSON.stringify();const d=document.createElement("div");d.className="text-box";const l=document.createElement("div");l.className="char-display-name",d.textContent=t.displayName,d.appendChild(l),r.appendChild(s),r.appendChild(d),characterNodes.appendChild(r),chartContent.appendChild(characterNodes)}function createChart(t){document.body.innerHTML="",chart.appendChild(chartContent),document.body.appendChild(chart);const{min:e,max:n}=getRange(t,"height"),{min:a,max:o}=getRange(t,"weight");addLines(e,n,"cm","horizontal"),addLines(a,o,"kg","vertical"),t.forEach(t=>{addCharacter(t,e,n,a,o)})}const form=document.getElementById("password");form.addEventListener("submit",async function(t){t.preventDefault();const e=document.getElementById("input-box").value;try{const t=await fetch("data.enc");if(!t.ok)throw new Error;const n=await t.text(),a=CryptoJS.AES.decrypt(n,e).toString(CryptoJS.enc.Utf8);if(a){createChart(JSON.parse(a))}}catch(t){alert("잘못된 비밀번호입니다.")}});
</script>
</body>
</html>
