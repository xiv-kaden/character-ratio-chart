       @import url(https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css);#chart,.dot,.password-modal{box-sizing:border-box}#info-modal,.char-node,.line,.line-label,.text-box{position:absolute}.char-node,.modal,.status-chip,.title,body{display:flex}*{text-decoration:none}:root{--rounded-corner-circle:9999px;--rounded-corner-large:16px;--rounded-corner-normal:8px;--rounded-corner-small:4px;--rounded-corner-none:0px;--default-color:#000;--border-color-dark:#231815;--border-color-mid:#999999;--border-color-light:#cfcfcf;--baseLine-color:#ff0000;--background-color:#d9d9d9;--background-color-before:#888888;--border-thick:2px;--border-normal:0.5px;--border-light:0.5px;--point-size:10px;--glass-shadow:0.5px 0.5px 0.5px inset oklab(100% 0 0 / 0.5),-0.5px -0.5px 0.5px inset oklab(100% 0 0 / 0.5),0 8px 30px oklab(0% 0 0 / 0.2);--glass-bg:linear-gradient(32deg,rgba(255, 255, 255, 0.02) 0%,rgba(255, 255, 255, 0.05) 100%),rgba(255, 255, 255, 50%);--filter-set:blur(10px) saturate(180%)}body{font-family:pretendard,Arial,sans-serif;height:100vh;margin:0;justify-content:center;align-items:center;background-color:var(--background-color-before);z-index:0}body[data-pw=success]{background-color:var(--background-color)}.title{margin:0 auto;align-items:center}#chart{transition:1s;width:calc(100% - 60px);height:calc(100% - 60px);border:1px solid var(--default-color);overflow-y:auto;padding:60px;border-radius:var(--rounded-corner-large)}#chart-content{border-left:2px solid var(--baseLine-color);border-bottom:2px solid var(--baseLine-color);margin-left:-2px;margin-bottom:-2px;width:100%;height:100%;position:relative}.password-modal{display:flex;text-align:center;max-width:400px;max-height:250px;align-items:center;border:1px solid var(--border-color-mid);border-radius:var(--rounded-corner-large);padding:40px 30px;background-color:#fff;flex-direction:column}input:focus-visible{outline:0}#input-box{margin-top:10px;height:20px;width:200px;padding:10px;borde <script>
    const chart=document.createElement("div");chart.id="chart";const chartContent=document.createElement("div");chartContent.id="chart-content";const characterNodes=document.createElement("div");characterNodes.className="node-container";const getRange=(t,e)=>{const a=t.filter(t=>{const e=parseFloat(t.height),a=parseFloat(t.weight);return Number.isFinite(e)&&e>0&&Number.isFinite(a)&&a>0}).map(t=>parseFloat(t[e]));return 0===a.length?{min:0,max:0}:{min:10*Math.trunc(.1*Math.min(...a))-10,max:10*Math.trunc(.1*Math.max(...a))+10}},normalize=(t,e,a)=>(t-e)/(a-e),bmiRatio=t=>t<=18.5?{status:"저체중",color:"#2D96E0"}:t<=23?{status:"정상",color:"#8EC73B"}:t<=25?{status:"과체중",color:"#F19739"}:{status:"비만",color:"#F75637"};function addLines(t,e,a,n){const d=document.createElement("div");d.className=`line-container ${n}`;const o=document.createElement("div");o.classList.add("line-label"),o.style.position="absolute",o.style.zIndex="3",o.textContent=`${t}${a}`,"horizontal"===n?(o.style.left=t<100?"-44px":"-53px",o.style.bottom="0px"):(o.style.left="0px",o.style.bottom="-20px"),d.appendChild(o);for(let o=t+1;o<e;o+=1){const i=100*normalize(o,t,e),l=document.createElement("div");if(l.classList.add("line",`${n}`),"horizontal"===n?l.style.bottom=`${i}%`:l.style.left=`${i}%`,o%100==0){l.classList.add("thick");const t=document.createElement("div");t.classList.add("line-label"),t.textContent=`${o}${a}`,"horizontal"===n?(t.style.left="-53px",t.style.bottom=`${i}%`):(t.style.left=`${i+.15}%`,t.style.bottom="-20px"),d.appendChild(t)}else o%10==0?l.classList.add("medium"):l.classList.add("light");d.appendChild(l)}chartContent.appendChild(d)}function addCharacter(t,e,a,n,d){const o=100*normalize(parseFloat(t.weight),n,d),i=100*normalize(parseFloat(t.height),e,a);if(!Number.isFinite(o)||!Number.isFinite(i))return;const l=document.createElement("div");l.className="char-node",l.style.left=`${o}%`,l.style.bottom=`${i}%`,l.dataset.info=JSON.stringify(t);const s=document.createElement("div");s.classNa
